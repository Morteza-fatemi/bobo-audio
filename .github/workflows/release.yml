name: Versioned Source Release
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: read

jobs:
  source-checks:
    name: release-source-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python source
        run: python -m compileall -q app.py tests
      - name: Run regressions
        run: python -m unittest discover -s tests -p 'test_*.py' -v
  windows-native:
    name: release-windows-native
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Native hook and Python regressions
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  publish-source:
    name: publish-versioned-preview
    runs-on: ubuntu-latest
    needs: [source-checks, windows-native]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate semantic version tag and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - name: Publish source-only preview after all checks pass
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; do not replace it."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --target "$GITHUB_SHA" \
            --title "BOBO $GITHUB_REF_NAME — source preview" \
            --generate-notes --prerelease --latest=false
