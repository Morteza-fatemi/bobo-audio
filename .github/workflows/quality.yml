name: Quality

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  python-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile public Python sources
        run: python -m compileall -q app.py debug_listen.py test_hook_debug.py test_mic_levels.py test_wasapi.py test_windows_mic.py
      - name: Reject local secrets
        shell: bash
        run: |
          set -euo pipefail
          test ! -e web_password.txt
          test ! -e .bobo_session_key
          if git grep -nI -E '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})' -- ':!*.lock'; then
            echo 'Potential secret detected.'
            exit 1
          fi
